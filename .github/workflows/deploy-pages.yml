name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # IMPORTANT: gives access to github-pages environment variables
    environment: github-pages

    env:
      NEXT_PUBLIC_PROJECTS: ${{ vars.NEXT_PUBLIC_PROJECTS }}
      NEXT_PUBLIC_CERTIFICATIONS: ${{ vars.NEXT_PUBLIC_CERTIFICATIONS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Debug env
        run: |
          echo "Projects length: ${#NEXT_PUBLIC_PROJECTS}"
          echo "Certifications length: ${#NEXT_PUBLIC_CERTIFICATIONS}"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4